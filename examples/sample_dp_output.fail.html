<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bad report example</title>
  <style>body { line-height: 1.4; } :focus-visible { outline: 2px solid blue; } @media (prefers-reduced-motion: reduce) { * { transition: none; } }</style>
</head>
<body>
  <main>
    <h1>Bad report example</h1>
    <section><h2>One-sentence summary</h2><p>They talked about school.</p></section>
    <section><h2>What was decided</h2><ul>
      <li>Move the Wednesday exam.</li>
      <li>The student should make more eye contact and act more normal.</li>
      <li>Adopt a new textbook.</li>
    </ul></section>
    <section><h2>Next steps</h2><ol><li>Do better.</li></ol></section>
    <section><h2>Presenting outline</h2><ol><li>Be more social.</li></ol></section>
  </main>
</body>
</html>
