name: Public evaluation

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  offline-eval:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install the public harness
        run: python -m pip install -e ".[dev]"
      - name: Run offline tests
        run: pytest -q
