name: Sync transcripts to Google Drive

on:
  push:
    branches: [main]
    paths:
      - 'transcripts/*.json'
      - 'tools/sync_transcripts_to_drive.py'
      - '.github/workflows/sync-transcripts.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: transcript-drive-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install '.[drive-sync]'
      - name: Sync changed files
        env:
          GOOGLE_DRIVE_CREDENTIALS_JSON: ${{ secrets.GOOGLE_DRIVE_CREDENTIALS_JSON }}
        run: |
          if [ -z "$GOOGLE_DRIVE_CREDENTIALS_JSON" ]; then
            echo 'Configure the GOOGLE_DRIVE_CREDENTIALS_JSON repository secret first.'
            exit 1
          fi
          python tools/sync_transcripts_to_drive.py
